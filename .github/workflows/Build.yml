name: Build Hurras APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json app/google-services.json
          fi

      - name: Prepare signing key
        env:
          SIGNING_PEM: ${{ secrets.SIGNING_PEM }}
        run: |
          test -n "$SIGNING_PEM" || { echo "::error::Add the SIGNING_PEM secret (content of hurras-signing-key.pem)"; exit 1; }
          printf '%s\n' "$SIGNING_PEM" > key.pem
          openssl pkcs12 -export -inkey key.pem -in signing/cert.pem -name hurras \
            -out app/release.p12 -passout pass:hurras-build \
            || { echo "::error::The key does not match the app certificate"; exit 1; }
          rm -f key.pem
          FP=$(keytool -list -v -keystore app/release.p12 -storetype PKCS12 -storepass hurras-build | grep 'SHA1:' | head -1 | awk '{print $2}')
          echo "Signing SHA1: $FP"
          test "$FP" = "5D:08:26:4B:44:E0:E5:3F:BC:CC:70:B4:F0:16:47:4C:C6:C5:AB:5C" || { echo "::error::Unexpected certificate fingerprint"; exit 1; }

      - name: Build official APK
        run: gradle :app:assembleOfficialRelease --no-daemon --stacktrace

      - name: Build developer APK
        continue-on-error: true
        run: |
          if grep -q '"com.hurras.island.dev"' app/google-services.json; then
            gradle :app:assembleDevRelease --no-daemon --stacktrace
          else
            echo "::warning::com.hurras.island.dev is not registered in Firebase - skipping the developer APK"
          fi

      - name: Publish APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hurras v1.13 (build ${{ github.run_number }})
          files: app/build/outputs/apk/**/*.apk
